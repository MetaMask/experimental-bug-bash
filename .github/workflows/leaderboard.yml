name: Bug Bash leaderboard

on:
  schedule:
    # Every 15 minutes. GitHub may delay cron a few minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/build-leaderboard.mjs"
      - ".github/workflows/leaderboard.yml"

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rebuild standings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-leaderboard.mjs

      - name: Print roster size
        run: node -e 'const d=JSON.parse(require("fs").readFileSync("data.json","utf8")); console.log("Roster size:", d.totals.designers);'

      - name: Package site
        run: |
          mkdir -p _site
          cp index.html data.json _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
